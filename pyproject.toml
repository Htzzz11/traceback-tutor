[project]
name = "traceback-tutor"
version = "0.1.0"
description = "A small fine-tuned LLM that explains beginner Python errors with a hint, not the fix."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "datasets>=3.0",
    "mlx-lm>=0.20",
    "openai>=3.28.0",
]

[project.scripts]
explain = "traceback_tutor.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/traceback_tutor"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
